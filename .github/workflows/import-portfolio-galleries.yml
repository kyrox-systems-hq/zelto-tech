name: Import portfolio galleries

on:
  push:
    branches: [portfolio-gallery-rebuild]
    paths:
      - '.github/portfolio-gallery-ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-gallery-rebuild

      - name: Download gallery assets
        run: |
          set -euo pipefail
          mkdir -p public/assets/projects/{xiq,refined-vision,devvolve,people-water,fizzy-funk}

          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXcMY75Y-YHNbKln-SyHhVECU_MdXVx82OHwFOtKFSm2PuEKn0n1C6MP8eKjjx0DBOZ9YtI2RZPx5cRQE4rH2PErarxORBZIaW7IUT7Ppg3LrLCbNTIEX05yNaeGu9YTBhM57NofYSlpDSdofXSOjKhaLZoh438UFfzNLo10KytPjGc7LHShOg=s2048?key=Z1bs-Ete5MntFEyTaGxwCg' -o public/assets/projects/xiq/gallery-sprite.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXdS8mgRcKIQ87vgs-eSux8Kz0giZbSGvct4RtLL37zmDe6blKP26z_K4ZRFBsjX6D8dL48nj_uJ-LCPc1qIsN5GPy_K9I3thx_tjHak4WsQ6sPkvXdgYLvwXWjOSKHYCI11y93HY5PXFLC9EIBEj-0j6u6e8nvG4HT8cp1Q2JF6nWao8xKnSA=s2048?key=Z1bs-Ete5MntFEyTaGxwCg' -o public/assets/projects/refined-vision/gallery-sprite.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXc2PXwvx534D4CSmLHjAmKQ5OxkjyDSQjlSiG0L16V9rALUOlhmOOBhUn3CYmpum6OxxDfdV3GPyVCXDhmaWWxNAoMiJtXHiPzjexiEEZjAwwf-LGaU6939j0TnGmUXEWVNVTtt92YUmp2sN28MDxO_T43XhbsDir3MrWOiqvWcyyOj5Ksqug=s2048?key=Z1bs-Ete5MntFEyTaGxwCg' -o public/assets/projects/devvolve/gallery-sprite.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXeO6xXO7LPVclXtLESS4BshZTB2EEcvCJhyxzcDbXIcB4aLb59EhxAUoUb1BEgiQGZlywMfxxXcNLPrsd-iDS3iTsT3bLEKD49EVutjvexmIrh1plxltV7MnL_f7vXymJwWMYXSclAloITVPTsdKza7CvB7n-0gMT88G4gCrCv_rJcKZaZnHA=s2048?key=Z1bs-Ete5MntFEyTaGxwCg' -o public/assets/projects/people-water/gallery-sprite.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXeWAA08PsN5bKsT4cVTS0GyXHbXMohaRyJ0irmWud9rMtjXaEEXR6KCWslddX1Lw2rFN5gDBaTJm9Whqx-jhgym-wo7Wl6I7S26dkDm_GYlhlFJEiXlwMLAfsU3qff3tYiDJMNyrelxNe9c8f05CJkvQZB9Ea2fBCGs0jVLrR6Ef9u35LG_Ng=s2048?key=Z1bs-Ete5MntFEyTaGxwCg' -o public/assets/projects/fizzy-funk/gallery-sprite.jpg

          test -s public/assets/projects/xiq/gallery-sprite.jpg
          test -s public/assets/projects/refined-vision/gallery-sprite.jpg
          test -s public/assets/projects/devvolve/gallery-sprite.jpg
          test -s public/assets/projects/people-water/gallery-sprite.jpg
          test -s public/assets/projects/fizzy-funk/gallery-sprite.jpg
          file public/assets/projects/*/gallery-sprite.jpg

      - name: Commit gallery assets
        run: |
          set -euo pipefail
          rm -f .github/portfolio-gallery-ready
          rm -f .github/workflows/import-portfolio-galleries.yml
          rm -f PORTFOLIO_GALLERY_REBUILD.md
          rm -f public/project-image-loader.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add complete portfolio gallery assets'
          git push origin HEAD:portfolio-gallery-rebuild
